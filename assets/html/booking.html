  <section id="booking">
    <h2>Book a Meeting</h2>
    <div class="contact-form-box booking-box">
      <form id="booking-form">
        <div class="form-row-group">
          <div class="form-row">
            <label for="booking-name">Name</label>
            <input type="text" id="booking-name" name="name" autocomplete="name" required>
          </div>
          <div class="form-row">
            <label for="booking-email">Email</label>
            <input type="email" id="booking-email" name="email" autocomplete="email" required>
          </div>
        </div>
        <div class="form-row-group">
          <div class="form-row">
            <label for="booking-type">Meeting type</label>
            <select id="booking-type" name="type" required>
              <option value="Consulting">Consulting</option>
              <option value="Interview">Interview</option>
              <option value="Technical review">Technical review</option>
              <option value="Mentoring">Mentoring</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-row">
            <label for="booking-title">Meeting title</label>
            <input type="text" id="booking-title" name="title" maxlength="150" required>
          </div>
        </div>
        <div class="form-row-group">
          <div class="form-row">
            <label for="booking-date">Date</label>
            <input type="date" id="booking-date" name="date" required>
          </div>
          <div class="form-row">
            <label for="booking-duration">Duration</label>
            <select id="booking-duration" name="duration" required>
              <option value="30">30 minutes</option>
              <option value="60" selected>1 hour</option>
              <option value="90">1.5 hours</option>
              <option value="120">2 hours</option>
              <option value="180">3 hours</option>
            </select>
          </div>
        </div>
        <div class="form-row-group">
          <div class="form-row">
            <label for="booking-time">Start time (Eastern Time)</label>
            <select id="booking-time" name="time" required disabled>
              <option value="">Pick a date first</option>
            </select>
          </div>
          <div class="form-row">
            <span class="form-label">Fee</span>
            <div id="booking-summary" class="booking-summary" aria-live="polite">
              <span class="booking-fee" id="booking-fee">—</span>
              <span class="booking-fee-detail" id="booking-fee-detail">Select a date, start time and duration to see the fee.</span>
            </div>
          </div>
        </div>
        <div class="form-row">
          <label for="booking-notes">Notes (optional)</label>
          <textarea id="booking-notes" name="notes" rows="4" maxlength="2000"></textarea>
        </div>

        <button type="submit" id="booking-submit" class="form-submit">Book &amp; Pay</button>
        <p class="booking-note">Your booking is confirmed once payment is received. You will get a confirmation email later.</p>
        <p id="booking-status" class="contact-status" aria-live="polite"></p>
      </form>
    </div>
  </section>
