  <section id="contact">
    <h2>Contact</h2>
    <div class="contact-layout">
      <div class="contact-form-box">
        <form id="contact-form">
          <div class="form-row">
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" name="name" autocomplete="name" required>
          </div>
          <div class="form-row">
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" name="email" autocomplete="email" required>
          </div>
          <div class="form-row">
            <label for="contact-subject">Subject</label>
            <input type="text" id="contact-subject" name="subject" required>
          </div>
          <div class="form-row form-row-grow">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="9" required></textarea>
          </div>
          <button type="submit" id="contact-submit">Send Message</button>
          <p id="contact-status" class="contact-status" aria-live="polite"></p>
        </form>
      </div>
      <div class="contact-map">
        <iframe
          title="Map – Waterloo, Ontario, Canada"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d92638.70722139078!2d-80.62911917881365!3d43.48231347455698!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x882bf1565ffe672b%3A0x5037b28c7231d90!2sWaterloo%2C%20ON!5e0!3m2!1sen!2sca!4v1780869856480!5m2!1sen!2sca"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen></iframe>
    </div>
    </div>
  </section>
